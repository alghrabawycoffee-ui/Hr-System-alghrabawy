version: '3.9'

services:
  db:
    image: postgres:16
    container_name: hr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-hr_db}
    ports:
      - "5432:5432"
    volumes:
      - hr_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  hr_pgdata:
